
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Song</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Guess the Song🤔</h1>
        <div class="game-area">
            <button id="play-btn">Play Song</button>  
            <div id="letter-inputs" class="letter-inputs"></div>
            <div id="hint">Hint: None</div>
            <div id="songs-remaining" class="songs-remaining">Songs remaining: 0</div>
            <div class="button-container">
                <button id="submit-btn">Submit Guess</button>
                <button id="skip-btn">Skip Song</button>
                <button id="reset-btn">Reset Game</button>
            </div>
            <div id="result"></div>
            <div id="score" class="score">Score: 0</div>
            <div id="remaining-guesses">Remaining guesses: 3</div>
            <div id="wrong-letters">Wrong letters: None</div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
